<!DOCTYPE html> <!-- Define o tipo do documento como HTML5 -->
<html lang="pt-BR"> <!-- Inicia o elemento HTML e define o idioma como português do Brasil -->
<head> <!-- Início da seção de cabeçalho -->
    <meta charset="UTF-8"> <!-- Define a codificação de caracteres como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configura a visualização para dispositivos móveis -->
    <title>JavaScript</title> <!-- Define o título da página -->

    <!-- !defer garante que o JS execute após o carregamento do HTML -->
    <script defer src="script.js"></script> <!-- Importa o arquivo JavaScript com defer para carregar após o HTML -->
  
</head> <!-- Fim da seção de cabeçalho -->
<body> <!-- Início do corpo da página -->
    
</body> <!-- Fim do corpo da página -->
</html> <!-- Fim do documento HTML -->
