<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurum Lab - Login</title>
  <link rel="stylesheet" href="CSS/cadastro.css">
  <link rel="stylesheet" href="CSS/global.css">
</head>
<body>
    <!-- Seção cebeçalho -->
    <header class="cabecalho">
        <div class="cadastro">
            <h1>Cadastro</h1>
            <p class="cadastro">Crie uma nova conta de usuário para o Aurum Lab</p>
        </div>
        <div class="logo">
            <img src="assets/img/icone-logo.svg" alt="Logotipo Aurum Lab" class="logo">
        </div>
    </header>

    <!-- Seção do cadastro -->
     <main>

        <form class="cadastro-escrita">
            <div class="formulario">
                <div>
                    <label>Nome completo</label>
                    <input type="text" id="nome" placeholder="Seu nome" required>
                    <label>E-mail</label>
                    <input type="email" id="Email" placeholder="email@email.com" required>
                </div>
                
                <div>
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="*********" required>
                    <labelh3>Confirmar senha</label>
                    <input type="password" id="senha" placeholder="*********" required>
                </div>
            </div>

            <button class="botao-login" type="submit" >ENTRAR</button>
        </form>

        <a href="index.html" class="voltar">Voltar</a>

     </main>

     


</body>
</html>
