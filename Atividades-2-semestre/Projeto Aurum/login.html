<!DOCTYPE html> <!-- Define o tipo do documento como HTML5 -->
<html lang="pt-br"> <!-- Início do documento HTML, idioma português do Brasil -->
<head>
  <meta charset="UTF-8"> <!-- Define a codificação de caracteres para UTF-8 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsividade -->
  <title>Aurum Lab - Login</title> <!-- Título da página exibido na aba do navegador -->
  <link rel="stylesheet" href="CSS/login.css"> <!-- Importa o CSS de login -->
  <link rel="stylesheet" href="CSS/global.css"> <!-- Importa o CSS global -->
</head>
<body>
  <main class="container-login"> <!-- Container principal do login -->
    <!-- Lado esquerdo -->
    <aside class="painel-esquerdo"> <!-- Painel lateral esquerdo -->
      <img src="assets/img/logo-vertical.svg" alt="Logotipo Aurum Lab" class="logo"> <!-- Logo vertical -->
      <img src="assets/img/icone-logo.svg" alt="" class="logo-resp"> <!-- Logo responsiva (mobile) -->
      <p class="descricao">Sistema de Monitoramento e Gerenciamento de Dispositivos!</p> <!-- Descrição do sistema -->
      <a href="cadastro.html" class="link-cadastro">Cadastre-se</a> <!-- Link para cadastro -->
    </aside>

    <!-- Lado direito -->
    <section class="painel-direito"> <!-- Painel lateral direito -->
      <header class="cabecalho-login"> <!-- Cabeçalho do painel direito -->
        <h2 class="titulo-login">Bem vindo(a)!</h2> <!-- Título de boas-vindas -->
        <p class="subtitulo-login">Entre para começar a monitorar o seu ambiente</p> <!-- Subtítulo -->
      </header>

      <form class="form-login"> <!-- Formulário de login -->
        <label for="email">E-mail:</label> <!-- Label do campo e-mail -->
        <input type="email" id="email" placeholder="email@email.com" required> <!-- Campo de texto para e-mail -->

        <label for="senha">Senha:</label> <!-- Label do campo senha -->
        <div class="campo-senha"> <!-- Container do campo de senha -->
          <input type="password" id="senha" placeholder="*********" required> <!-- Campo de senha -->
          <span class="icone-olho"> <!-- Ícone para mostrar/ocultar senha -->
            <img src="assets/icon/eye.svg" alt=""> <!-- Imagem do ícone olho -->
          </span>
        </div>

        <button type="submit" class="botao-login">ENTRAR</button> <!-- Botão de envio do formulário -->

        <a href="#" class="link-esqueci">Esqueceu sua senha?</a> <!-- Link para recuperação de senha -->

        <p class="erro-login">E-mail e senha incorretos</p> <!-- Mensagem de erro de login -->
      </form>
    </section>
  </main>
</body>
</html> <!-- Fim do documento HTML -->
</html>
